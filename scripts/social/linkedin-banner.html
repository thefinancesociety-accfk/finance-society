<!doctype html>
<!-- Source for the LinkedIn banner (1584x396), FS monogram version. Render with: node scripts/social/render.mjs -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,500;1,400&display=block">
<style>
  html, body { margin: 0; width: 1584px; height: 396px; overflow: hidden; background: #0B0B0C; }
  .banner { position: relative; width: 1584px; height: 396px; overflow: hidden; color: #EEE8DD; font-family: Inter, sans-serif; }
  .guilloche { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.32; }
  .mark { position: absolute; right: 92px; top: 50%; height: 250px; width: auto; translate: 0 -58%; opacity: 0.95; }
  .shade { position: absolute; inset: 0; background: linear-gradient(90deg, #0B0B0C 0%, rgba(11,11,12,.92) 38%, rgba(11,11,12,.35) 70%, rgba(11,11,12,.15)); }
  /* LinkedIn's profile photo covers the lower-left corner, so the text sits right of it. */
  .copy { position: absolute; left: 470px; top: 78px; }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #C9A96E; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ""; width: 40px; height: 1px; background: currentColor; }
  h1 { font-family: "Playfair Display", serif; font-weight: 500; font-size: 104px; line-height: .95; letter-spacing: -.03em; margin: 22px 0 22px; }
  h1 em { font-style: italic; font-weight: 400; color: #C9A96E; }
  .line { font-size: 22px; color: #EEE8DD; opacity: .85; }
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 40px; display: flex; align-items: center; gap: 44px; padding-left: 470px;
    border-top: 1px solid #2E2B27; background: rgba(11,11,12,.85); font-family: "JetBrains Mono", monospace; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #A39A8C; }
  .ticker b { font-weight: 500; margin-right: 10px; color: #7DC39A; }
  .ticker b.dot { color: #C9A96E; }
</style>
</head>
<body>
  <div class="banner">
    <img class="guilloche" src="../../assets/img/guilloche-1920.webp" alt="">
    <img class="mark" src="../../assets/brand/logo-mark.webp" alt="">
    <div class="shade"></div>
    <div class="copy">
      <div class="eyebrow">Amity College of Commerce and Finance, Kolkata</div>
      <h1>Finance <em>Society</em></h1>
      <div class="line">Research · Markets · Careers — Amity University Kolkata</div>
    </div>
    <div class="ticker">
      <span><b>▲</b>Research</span><span><b>▲</b>Markets</span><span><b>▲</b>Careers</span><span><b class="dot">●</b>financesociety-accfk.pages.dev</span>
    </div>
  </div>
</body>
</html>
